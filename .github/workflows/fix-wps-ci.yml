name: Apply WPS CI fixes

on:
  push:
    branches:
      - feature/wps-writer

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wps-writer
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}')
              p.write_text(s.replace(old, new, 1))

          replace(
              'src/PhpWord/Writer/WPS/Contents.php',
              """        $r = hexdec(substr($hex, 0, 2));\n        $g = hexdec(substr($hex, 2, 2));\n        $b = hexdec(substr($hex, 4, 2));""",
              """        $r = hexdec((string) substr($hex, 0, 2));\n        $g = hexdec((string) substr($hex, 2, 2));\n        $b = hexdec((string) substr($hex, 4, 2));"""
          )

          replace(
              'src/PhpWord/Writer/WPS/Validator.php',
              """            } elseif ($id === 0x0C && $type === 0x22) {\n                if ($value % 12700 !== 0) {\n                    throw new RuntimeException('FDPC font size is not an exact integer point size.');\n                }\n                $font['size'] = intdiv($value, 12700);""",
              """            } elseif ($id === 0x0C && $type === 0x22) {\n                $numericValue = (int) $value;\n                if ($numericValue % 12700 !== 0) {\n                    throw new RuntimeException('FDPC font size is not an exact integer point size.');\n                }\n                $font['size'] = intdiv($numericValue, 12700);"""
          )

          replace(
              'src/PhpWord/Writer/WPS/CompoundFile.php',
              """        $entry = str_pad($nameBytes, 64, \"\\0\");\n        $entry .= $this->u16(strlen($nameBytes));\n        $entry .= chr($type) . chr(1); // black node""",
              """        if ($type < 0 || $type > 255) {\n            throw new InvalidArgumentException('CFB directory entry type is outside the byte range.');\n        }\n\n        $entry = str_pad($nameBytes, 64, \"\\0\");\n        $entry .= $this->u16(strlen($nameBytes));\n        $entry .= pack('C', $type) . chr(1); // black node"""
          )

          p = Path('src/PhpWord/Writer/WPS/Utf16.php')
          s = p.read_text()
          old = """    private static function codePointToUtf8(int $cp): string\n    {\n        if ($cp <= 0x7F) {\n            return chr($cp);\n        }\n        if ($cp <= 0x7FF) {\n            return chr(0xC0 | ($cp >> 6)) . chr(0x80 | ($cp & 0x3F));\n        }\n        if ($cp <= 0xFFFF) {\n            return chr(0xE0 | ($cp >> 12)) . chr(0x80 | (($cp >> 6) & 0x3F)) . chr(0x80 | ($cp & 0x3F));\n        }\n\n        return chr(0xF0 | ($cp >> 18)) . chr(0x80 | (($cp >> 12) & 0x3F))\n            . chr(0x80 | (($cp >> 6) & 0x3F)) . chr(0x80 | ($cp & 0x3F));\n    }"""
          new = """    private static function codePointToUtf8(int $cp): string\n    {\n        if ($cp < 0 || $cp > 0x10FFFF) {\n            throw new RuntimeException('Unicode code point is outside the valid range.');\n        }\n        if ($cp <= 0x7F) {\n            return self::byte($cp);\n        }\n        if ($cp <= 0x7FF) {\n            return self::byte(0xC0 | ($cp >> 6)) . self::byte(0x80 | ($cp & 0x3F));\n        }\n        if ($cp <= 0xFFFF) {\n            return self::byte(0xE0 | ($cp >> 12)) . self::byte(0x80 | (($cp >> 6) & 0x3F)) . self::byte(0x80 | ($cp & 0x3F));\n        }\n\n        return self::byte(0xF0 | ($cp >> 18)) . self::byte(0x80 | (($cp >> 12) & 0x3F))\n            . self::byte(0x80 | (($cp >> 6) & 0x3F)) . self::byte(0x80 | ($cp & 0x3F));\n    }\n\n    private static function byte(int $value): string\n    {\n        if ($value < 0 || $value > 255) {\n            throw new RuntimeException('UTF-8 byte is outside the valid range.');\n        }\n\n        return pack('C', $value);\n    }"""
          if old not in s:
              raise SystemExit('Expected Utf16 method not found')
          p.write_text(s.replace(old, new, 1))
          PY

          rm .github/workflows/fix-wps-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix PHPStan compatibility across supported PHP versions"
          git push origin feature/wps-writer
