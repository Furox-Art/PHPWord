name: Final WPS feature check

on:
  push:
    branches:
      - demo/wps-writer

jobs:
  final-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/wps-writer

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, xml, dom, json, fileinfo, curl, zip, iconv
          coverage: none

      - name: Install dependencies
        run: composer install --ansi --prefer-dist --no-interaction --no-progress

      - name: Run WPS tests
        run: ./vendor/bin/phpunit -c phpunit.xml.dist --no-coverage tests/PhpWordTests/Writer/WPSTest.php tests/PhpWordTests/IOFactoryTest.php

      - name: Run full upstream quality gate
        run: composer check
